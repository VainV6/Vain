name = "vain"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# KV namespace holding, all of it bot + rank state (Vain's file delivery no
# longer goes through this Worker at all -- see root README.md -- so nothing
# here gates loading):
#   discord:<id> / roblox:<id>  whitelist bindings, both directions
#   rankcache:<id>              the 60s-cached live Discord role check
#   token:<token>               in-game issuer tokens from /whitelist token
#   cmdq:<robloxUserId>         pending troll commands, expiring after 120s
[[kv_namespaces]]
binding = "KEYS"
id = "2a990242fbdf4b4aac895337ea05cb10"

# Secrets (DO NOT put these here -- set them with `wrangler secret put`):
#   DISCORD_BOT_TOKEN: from the Discord Developer Portal's Bot tab -- required,
#                       used for every guild-member/rank REST call.
#
#   npx wrangler secret put DISCORD_BOT_TOKEN
#
# GITHUB_PAT / ADMIN_TOKEN from the old paid-key delivery gate are no longer
# read by any code in this Worker -- safe to leave set or `wrangler secret
# delete` them, doesn't matter either way.

# Discord bot config. None of these are secret (public key, guild/role ids) --
# see server/README.md for where to find each one.
[vars]
DISCORD_PUBLIC_KEY = "50e0976c909bbfaa9f28dc3888e48880d6e97d3ea25ae69fce2fe34388bc12a4"
DISCORD_APPLICATION_ID = "1537107643666014229"
DISCORD_GUILD_ID = "1537108297763651714"

# Priority order, highest tier first -- resolveRank() picks the first entry
# here that the member holds a mapped role for. Free/unbound = not in this
# list at all, treated as rank level 0 everywhere.
RANK_ORDER = ["owner", "priviliged"]

# role id -> tier name. Add one line per rank role in your server.
[vars.RANK_ROLES]
1537108542870257795 = "priviliged"
1537108896215339058 = "owner"
